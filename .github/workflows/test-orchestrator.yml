name: test-orchestrator

on:
  pull_request:

defaults:
  run:
    working-directory: .github/actions/orchestrator

permissions:
  actions: write

jobs:
  test-orchestrator:
    runs-on: ubuntu-latest

    outputs:
      json-results: ${{ steps.run.outputs.json-results || '{}' }}


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .github/.tool-versions

      - name: Install
        run: deno install --frozen

      - name: Run
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PATTERN: "*-test.yml"
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: deno run --allow-env --allow-net --allow-read --allow-write main.ts

  lib-test:
    if: ${{ fromJSON(needs.test-orchestrator.outputs.json-results).lib-test == true }}
    needs: test-orchestrator
    uses: ./.github/workflows/lib-test.yml

  tools-bar-test:
    if: ${{ fromJSON(needs.test-orchestrator.outputs.json-results).tools-bar-test == true }}
    needs: test-orchestrator
    uses: ./.github/workflows/tools-bar-test.yml

  tools-baz-test:
    if: ${{ fromJSON(needs.test-orchestrator.outputs.json-results).tools-baz-test == true }}
    needs: test-orchestrator
    uses: ./.github/workflows/tools-baz-test.yml

  tools-foo-test:
    if: ${{ fromJSON(needs.test-orchestrator.outputs.json-results).tools-foo-test == true }}
    needs: test-orchestrator
    uses: ./.github/workflows/tools-foo-test.yml
