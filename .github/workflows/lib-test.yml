name: lib-test

on:
  pull_request:
    branches: main
    paths: 
      - .github/workflows/lib-test.yml
      - lib/**
  workflow_dispatch:

defaults:
  run:
    working-directory: lib

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - name: Test
        run: deno test
